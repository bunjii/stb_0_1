[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-toolbox"
version = "0.1.0"
description = "3D linear static analysis for frame structures"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "shapely",
]

[project.optional-dependencies]
viewer = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.scripts]
stb = "stb_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stb_engine*", "stb_cli*", "stb_viewer*"]
