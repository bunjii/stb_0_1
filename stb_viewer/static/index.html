<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Structural Toolbox Viewer</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="toolbar">
    <span class="title">STB Viewer</span>
    <label>
      Model
      <select id="modelSelect"></select>
    </label>
    <button id="btnReload" type="button">Reload</button>
    <button id="btnSolve" type="button" title="Run analysis (F5)">Solve</button>
    <button id="btnInput" type="button" class="btn-secondary">Input file…</button>
    <button id="btnTogglePanel" type="button" class="btn-secondary" title="Show/hide results panel">Results</button>
    <button id="btnToggleOptions" type="button" class="btn-secondary" title="Display options">Options</button>
    <button id="btnToggleAxes" type="button" class="btn-secondary active" title="Show/hide origin XYZ axes">Axes</button>
    <span id="status">Loading…</span>
  </div>
  <div id="viewport">
    <div id="dispLegendOverlay" class="viewport-disp-legend" hidden>
      <div id="dispLegendTitle" class="viewport-disp-legend-title">|u|</div>
      <div id="dispLegendLc" class="viewport-disp-legend-lc"></div>
      <label class="viewport-disp-legend-bound">
        <span class="viewport-disp-legend-bound-label">max</span>
        <input type="number" id="dispContourMax" step="any">
      </label>
      <div id="dispLegendBar" class="viewport-disp-legend-bar"></div>
      <label class="viewport-disp-legend-bound">
        <span class="viewport-disp-legend-bound-label">min</span>
        <input type="number" id="dispContourMin" step="any">
      </label>
      <button type="button" id="btnDispContourAuto" class="btn-disp-contour-auto">Auto</button>
    </div>
    <div id="viewerInfoOverlay" class="viewer-info-overlay"></div>
  </div>

  <div id="resultsPanel" class="float-panel">
    <div id="resultsPanelHeader" class="float-panel-header">
      <span class="float-panel-title">Results</span>
      <button type="button" id="btnPanelCollapse" class="btn-icon" title="Collapse">−</button>
    </div>
    <div id="resultsPanelBody" class="float-panel-body">
      <section class="panel-section">
        <div class="panel-section-title">Output</div>
        <button id="btnOutput" type="button" class="btn-block">Text output…</button>
      </section>

      <section class="panel-section">
        <div class="panel-section-title">Load case &amp; display</div>
        <label class="panel-row">
          <span>LC</span>
          <select id="lcSelect"></select>
        </label>
        <label class="panel-row">
          <span>Def. ×</span>
          <input type="number" id="defFactor" value="50" min="0" max="500" step="5">
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkDeformed"> Deformed shape
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkDispContour" disabled> Displacement contour
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkSupports" checked> Supports
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkLoads" checked> Input loads
        </label>
        <label class="panel-row">
          <span>Input type</span>
          <select id="loadTypeFilter">
            <option value="all">All</option>
            <option value="area">Area (ALOD)</option>
            <option value="gravity">Gravity (GLOD)</option>
            <option value="linepoint">Line + Point</option>
          </select>
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkLoadValues"> Load values
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkReactions"> Reactions
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkReactionValues"> Reaction values
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkLabels"> Node IDs
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkElemLabels"> Element IDs
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkMaterial"> Material
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkSection"> Section
        </label>
      </section>

      <section class="panel-section">
        <div class="panel-section-title">Element forces</div>
        <label class="panel-row">
          <span>Component</span>
          <select id="forceSelect" disabled>
            <option value="0">None</option>
            <option value="1">Nx</option>
            <option value="2">Vy</option>
            <option value="3">Vz</option>
            <option value="4">Mx</option>
            <option value="5">My</option>
            <option value="6">Mz</option>
          </select>
        </label>
        <label class="panel-row">
          <span>Division</span>
          <input type="range" id="frcDiv" min="1" max="16" value="8" disabled>
          <span class="range-val" id="frcDivVal">8</span>
        </label>
        <label class="panel-row">
          <span>Diagram ×</span>
          <input type="range" id="frcFactor" min="1" max="100" value="10" disabled>
          <span class="range-val" id="frcFactorVal">10</span>
        </label>
        <label class="panel-check">
          <input type="checkbox" id="chkForceValues" checked disabled> Show values
        </label>
        <div id="forceLegend" class="force-legend"></div>
      </section>
    </div>
  </div>

  <div id="optionsPanel" class="float-panel float-panel-left">
    <div id="optionsPanelHeader" class="float-panel-header">
      <span class="float-panel-title">Options</span>
      <button type="button" id="btnOptionsCollapse" class="btn-icon" title="Collapse">−</button>
    </div>
    <div id="optionsPanelBody" class="float-panel-body">
      <section class="panel-section">
        <div class="panel-section-title">Display scale</div>
        <p class="panel-hint">Saved automatically. Applies on next redraw.</p>
        <label class="panel-row">
          <span>Load arrow</span>
          <input type="range" id="optLoadArrow" min="0.1" max="5" step="0.1" value="1.0">
          <span class="range-val" id="optLoadArrowVal">1.0</span>
        </label>
        <label class="panel-row">
          <span>Support gizmo</span>
          <input type="range" id="optSupportGizmo" min="25" max="50" value="25">
          <span class="range-val" id="optSupportGizmoVal">25</span>
        </label>
        <label class="panel-row">
          <span>Support line</span>
          <input type="number" id="optSupportLineWidth" min="0.5" max="3" step="0.5" value="2">
          <span class="range-val">px</span>
        </label>
        <label class="panel-row">
          <span>Contour line</span>
          <input type="number" id="optDispContourLineWidth" min="0.5" max="3" step="0.5" value="2.5">
          <span class="range-val">px</span>
        </label>
        <label class="panel-row">
          <span>Element line</span>
          <input type="number" id="optElementLineWidth" min="0.5" max="3" step="0.5" value="1.5">
          <span class="range-val">px</span>
        </label>
        <label class="panel-row">
          <span>Load line</span>
          <input type="number" id="optLoadLineWidth" min="0.5" max="3" step="0.5" value="1.5">
          <span class="range-val">px</span>
        </label>
        <label class="panel-row">
          <span>Force line</span>
          <input type="number" id="optForceLineWidth" min="0.5" max="3" step="0.5" value="1.5">
          <span class="range-val">px</span>
        </label>
        <label class="panel-row">
          <span>Node ID</span>
          <input type="range" id="optNodeLabel" min="0.1" max="2" step="0.1" value="1.0">
          <span class="range-val" id="optNodeLabelVal">1.0</span>
        </label>
        <label class="panel-row">
          <span>Elem ID</span>
          <input type="range" id="optElemLabel" min="0.1" max="2" step="0.1" value="1.0">
          <span class="range-val" id="optElemLabelVal">1.0</span>
        </label>
        <label class="panel-row">
          <span>Material</span>
          <input type="range" id="optMaterialLabel" min="0.1" max="2" step="0.1" value="1.2">
          <span class="range-val" id="optMaterialLabelVal">1.2</span>
        </label>
        <label class="panel-row">
          <span>Section</span>
          <input type="range" id="optSectionLabel" min="0.1" max="2" step="0.1" value="1.0">
          <span class="range-val" id="optSectionLabelVal">1.0</span>
        </label>
        <label class="panel-row">
          <span>Load value</span>
          <input type="range" id="optLoadLabel" min="0.1" max="2" step="0.1" value="1.0">
          <span class="range-val" id="optLoadLabelVal">1.0</span>
        </label>
        <label class="panel-row">
          <span>Reaction value</span>
          <input type="range" id="optReactionLabel" min="0.1" max="2" step="0.1" value="1.0">
          <span class="range-val" id="optReactionLabelVal">1.0</span>
        </label>
        <label class="panel-row">
          <span>Force value</span>
          <input type="range" id="optForceLabel" min="0.1" max="2.5" step="0.1" value="1.5">
          <span class="range-val" id="optForceLabelVal">1.5</span>
        </label>
      </section>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="/static/viewer.js"></script>
</body>
</html>
